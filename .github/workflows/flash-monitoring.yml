name: Monitor flash flooding

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to process (YYYY-MM-DD format).'
        required: false
        type: string
      stage:
        description: Whether to run the monitoring in dev/test mode, or "for real"
        type: choice
        options:
          - dev
          - prod
        default: dev
      test_email:
        description: Send only to the test recipient (Tristan) even when stage=prod
        type: boolean
        default: false

  # Manual fallback only. The daily 01:30 UTC run is the Databricks job
  # "NGA Flash Flood Monitoring" defined in databricks.yml; GitHub Actions
  # runners are losing network access to the Postgres DB.

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
        python -m pip install -r requirements.txt

    - name: Run script
      env:
        DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        DSCI_AZ_BLOB_DEV_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS_WRITE }}
        DSCI_AZ_BLOB_PROD_SAS: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS }}
        DSCI_AZ_BLOB_PROD_SAS_WRITE: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS_WRITE }}
        DSCI_AZ_DB_PROD_PW: ${{ secrets.DSCI_AZ_DB_PROD_PW }}
        DSCI_AZ_DB_PROD_UID: ${{ secrets.DSCI_AZ_DB_PROD_UID }}
        DSCI_AZ_DB_PROD_HOST: ${{ secrets.DSCI_AZ_DB_PROD_HOST }}
        # TEMPORARY: SES backend while Listmonk (on the dev DB) is down
        DSCI_AWS_EMAIL_HOST: ${{ secrets.DSCI_AWS_EMAIL_HOST }}
        DSCI_AWS_EMAIL_USERNAME: ${{ secrets.DSCI_AWS_EMAIL_USERNAME }}
        DSCI_AWS_EMAIL_PASSWORD: ${{ secrets.DSCI_AWS_EMAIL_PASSWORD }}
        DSCI_AWS_EMAIL_ADDRESS: ${{ secrets.DSCI_AWS_EMAIL_ADDRESS }}
        EMAIL_BACKEND: ses
        TEST_EMAIL: ${{ inputs.test_email || 'false' }}
        # ocha-relay reads DSCI_LISTMONK_BASE_URL; the org secret is named
        # DSCI_LISTMONK_API_URL
        DSCI_LISTMONK_BASE_URL: ${{ secrets.DSCI_LISTMONK_API_URL }}
        DSCI_LISTMONK_API_USERNAME: ${{ secrets.DSCI_LISTMONK_API_USERNAME }}
        DSCI_LISTMONK_API_KEY: ${{ secrets.DSCI_LISTMONK_API_KEY }}
        MONITORING_DATE: ${{ inputs.date || '' }}
        STAGE: ${{ inputs.stage || vars.STAGE || 'dev'}}

      run: |
        python pipelines/monitor_flash_flood.py

    - name: Publish flash monitoring status
      env:
        DSCI_AZ_BLOB_DEV_SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        DSCI_AZ_BLOB_PROD_SAS: ${{ secrets.DSCI_AZ_BLOB_PROD_SAS }}
        STAGE: ${{ inputs.stage || vars.STAGE || 'dev'}}
        DSCI_AZ_DB_PROD_PW: ${{ secrets.DSCI_AZ_DB_PROD_PW }}
        DSCI_AZ_DB_PROD_UID: ${{ secrets.DSCI_AZ_DB_PROD_UID }}
        DSCI_AZ_DB_PROD_HOST: ${{ secrets.DSCI_AZ_DB_PROD_HOST }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git fetch origin monitoring-status:monitoring-status 2>/dev/null || true
        if git rev-parse --verify monitoring-status >/dev/null 2>&1; then
          git worktree add /tmp/status-branch monitoring-status
        else
          git worktree add --orphan -b monitoring-status /tmp/status-branch
        fi
        mkdir -p /tmp/status-branch/exploration/2026/cerf/monitoring
        mkdir -p exploration/2026/cerf/monitoring

        # Seed with the branch's current status.json so this run only
        # updates its own section, not the riverine section written by the
        # other pipeline
        cp /tmp/status-branch/exploration/2026/cerf/monitoring/status.json \
           exploration/2026/cerf/monitoring/status.json 2>/dev/null || true

        python pipelines/export_monitoring_status.py flash

        cp exploration/2026/cerf/monitoring/status.json \
           exploration/2026/cerf/monitoring/flash_latest.png \
           /tmp/status-branch/exploration/2026/cerf/monitoring/

        cd /tmp/status-branch
        git add exploration/2026/cerf/monitoring/status.json \
          exploration/2026/cerf/monitoring/flash_latest.png
        git diff --staged --quiet || git commit -m "update flash monitoring status"
        git push origin monitoring-status
